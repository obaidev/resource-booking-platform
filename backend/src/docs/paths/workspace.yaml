/api/workspace:
  post:
    summary: Create a workspace
    tags:
      - Workspace
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateWorkspaceRequest"
    responses:
      "201":
        description: Workspace created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResponse"
      "400":
        description: Invalid request
      "401":
        description: Unauthorized
      "403":
        description: Access denied

  get:
    summary: Get all workspaces
    tags:
      - Workspace
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Workspaces fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceListResponse"
      "401":
        description: Unauthorized
      "403":
        description: Access denied

/api/workspace/{id}:
  get:
    summary: Get workspace by ID
    tags:
      - Workspace
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456
    responses:
      "200":
        description: Workspace retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResponse"
      "401":
        description: Unauthorized
      "404":
        description: Workspace not found

  patch:
    summary: Update workspace
    tags:
      - Workspace
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateWorkspaceRequest"
    responses:
      "200":
        description: Workspace updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResponse"
      "400":
        description: Invalid request
      "401":
        description: Unauthorized
      "404":
        description: Workspace not found

  delete:
    summary: Delete workspace
    tags:
      - Workspace
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456
    responses:
      "200":
        description: Workspace deleted successfully
      "401":
        description: Unauthorized
      "404":
        description: Workspace not found

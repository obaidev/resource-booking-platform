/api/resource:
  post:
    summary: Create a resource
    tags:
      - Resource
    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateResourceRequest"

    responses:
      "201":
        description: Resource created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceResponse"

      "400":
        description: Invalid request

      "401":
        description: Unauthorized

      "403":
        description: Access denied

      "404":
        description: Workspace not found

  get:
    summary: Get all resources
    tags:
      - Resource
    security:
      - bearerAuth: []

    responses:
      "200":
        description: Resources fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceListResponse"

      "401":
        description: Unauthorized

/api/resource/{id}:
  get:
    summary: Get resource by ID
    tags:
      - Resource
    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456

    responses:
      "200":
        description: Resource retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceResponse"

      "401":
        description: Unauthorized

      "404":
        description: Resource not found

  patch:
    summary: Update resource
    tags:
      - Resource
    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateResourceRequest"

    responses:
      "200":
        description: Resource updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceResponse"

      "400":
        description: Invalid request

      "401":
        description: Unauthorized

      "403":
        description: Access denied

      "404":
        description: Resource not found

  delete:
    summary: Delete resource
    tags:
      - Resource
    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456

    responses:
      "200":
        description: Resource deleted successfully

      "401":
        description: Unauthorized

      "403":
        description: Access denied

      "404":
        description: Resource not found

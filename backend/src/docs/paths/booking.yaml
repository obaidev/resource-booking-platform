/api/booking:
  post:
    summary: Create a booking
    tags:
      - Booking
    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateBookingRequest"

    responses:
      "201":
        description: Booking created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingResponse"

      "400":
        description: Invalid request or time range

      "401":
        description: Unauthorized

      "403":
        description: Access denied

      "404":
        description: Resource not found

      "409":
        description: Resource is already booked for this time

  get:
    summary: Get all bookings
    tags:
      - Booking
    security:
      - bearerAuth: []

    responses:
      "200":
        description: All bookings fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingListResponse"

      "401":
        description: Unauthorized

      "403":
        description: Access denied

/api/booking/my-bookings:
  get:
    summary: Get my bookings
    tags:
      - Booking
    security:
      - bearerAuth: []

    responses:
      "200":
        description: User bookings fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingListResponse"

      "401":
        description: Unauthorized

      "403":
        description: Access denied

/api/booking/{id}/cancel:
  post:
    summary: Cancel a booking
    tags:
      - Booking
    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64f123456789abcdef123456

    responses:
      "200":
        description: Booking cancelled successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingResponse"

      "401":
        description: Unauthorized

      "403":
        description: Access denied

      "404":
        description: Booking not found

/api/booking/workspace:
  get:
    summary: Get workspace bookings
    tags:
      - Booking
    security:
      - bearerAuth: []

    responses:
      "200":
        description: Workspace bookings fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingListResponse"

      "401":
        description: Unauthorized

      "403":
        description: Access denied
/api/booking/availability:
  get:
    summary: Get available resources
    tags:
      - Booking
    security:
      - bearerAuth: []

    parameters:
      - name: startTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: "2026-10-10T10:00:00.000Z"

      - name: endTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: "2026-10-10T12:00:00.000Z"

      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1

      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - createdAt
            - name
            - hourlyPrice
          default: createdAt

      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
            - asc
            - desc
          default: asc

      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0

      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0

    responses:
      "200":
        description: Available resources fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Available resources fetched
                resources:
                  type: array
                  items:
                    $ref: "#/components/schemas/Resource"
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    limit:
                      type: integer
                    total:
                      type: integer
                    totalPages:
                      type: integer

      "400":
        description: Invalid time range

      "401":
        description: Unauthorized
